name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Download Go dependencies
        run: go mod download

      - name: Gofmt
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2.x prebuilt binaries are built with Go 1.26, which satisfies
          # the version guard for projects targeting Go 1.25.x.
          # v1.64.8 (last v1 release, built with Go 1.24) can't analyze Go 1.25.
          version: v2.12.2

      - name: Test
        # CGO_ENABLED=0 is the project rule (pure-Go sqlite; the pdf_oxide
        # backend's purego bindings dlopen at runtime and only link with cgo
        # disabled). This also means -race is unavailable: the race detector
        # requires cgo, and cgo-on breaks the resume backend's link. Matches
        # `make test`.
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Frontend tests
        run: pnpm test
        working-directory: web
